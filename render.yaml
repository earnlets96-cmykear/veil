# ==============================================================================
# VEIL Render Deployment Blueprint (Infrastructure as Code)
# Web Service connecting to Supabase PostgreSQL & Cloudflare R2
# ==============================================================================

services:
  - type: web
    name: veil-backend
    env: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start:server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard securely (Supabase connection string)
      - key: R2_ENDPOINT
        sync: false # Set in Render Dashboard (e.g., https://<account-id>.r2.cloudflarestorage.com)
      - key: R2_BUCKET
        value: veil-attachments
      - key: R2_ACCESS_KEY_ID
        sync: false # Set in Render Dashboard securely
      - key: R2_SECRET_ACCESS_KEY
        sync: false # Set in Render Dashboard securely
      - key: R2_REGION
        value: auto
