version: '3.8'

# VEIL Production Infrastructure Stack
# Services: Caddy (TLS 1.3 Reverse Proxy), VEIL Backend, PostgreSQL DB, MinIO (S3 Object Storage)

networks:
  veil-internal:
    driver: bridge
    internal: true
  veil-public:
    driver: bridge

volumes:
  veil-postgres-data:
    driver: local
  veil-minio-data:
    driver: local
  veil-caddy-data:
    driver: local
  veil-caddy-config:
    driver: local

services:
  caddy:
    image: caddy:2-alpine
    container_name: veil-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../Caddyfile.production:/etc/caddy/Caddyfile:ro
      - veil-caddy-data:/data
      - veil-caddy-config:/config
    networks:
      - veil-public
      - veil-internal
    depends_on:
      - veil-backend

  veil-backend:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
    container_name: veil-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - RELAY_HOST=0.0.0.0
      - RELAY_PORT=8787
      - DATABASE_URL=postgresql://veil:${POSTGRES_PASSWORD:-veil_secure_password}@postgres:5432/veil_db
      - OBJECT_STORAGE_ENDPOINT=http://minio:9000
      - OBJECT_STORAGE_BUCKET=veil-encrypted-attachments
      - OBJECT_STORAGE_ACCESS_KEY=${MINIO_ROOT_USER:-veil_minio_admin}
      - OBJECT_STORAGE_SECRET_KEY=${MINIO_ROOT_PASSWORD:-veil_minio_secure_key}
      - SESSION_SECRET=${SESSION_SECRET:-veil_production_session_secret_32bytes}
      - RELAY_LOG_LEVEL=info
    networks:
      - veil-internal
    depends_on:
      - postgres
      - minio
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8787/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: veil-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=veil
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-veil_secure_password}
      - POSTGRES_DB=veil_db
    volumes:
      - veil-postgres-data:/var/lib/postgresql/data
    networks:
      - veil-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veil -d veil_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: veil-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-veil_minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-veil_minio_secure_key}
    volumes:
      - veil-minio-data:/data
    networks:
      - veil-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
