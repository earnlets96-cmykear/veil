<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VEIL — Privacy-First Multi-Space Messenger</title>
    <meta name="description" content="VEIL: Privacy-First Messaging with Multi-Space Cryptographic Isolation, Blind Mailbox Transport, and End-to-End Encryption." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/veil-design-system.css" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--veil-bg-base);
        color: var(--veil-text-primary);
        font-family: var(--veil-font-sans);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .veil-app-container {
        width: 100%;
        max-width: 520px;
        padding: 24px;
      }
      .veil-auth-card, .veil-space-dashboard {
        background: var(--veil-bg-surface);
        border: 1px solid var(--veil-border);
        border-radius: var(--veil-radius-lg);
        padding: 32px;
        box-shadow: var(--veil-shadow-lg);
      }
      .veil-auth-header {
        text-align: center;
        margin-bottom: 28px;
      }
      .veil-logo-icon {
        font-size: 3rem;
        margin-bottom: 12px;
      }
      .veil-title {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        background: linear-gradient(135deg, #f8fafc 0%, #a855f7 50%, #6366f1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .veil-subtitle {
        color: var(--veil-text-secondary);
        font-size: 0.95rem;
        margin-top: 4px;
      }
      .veil-badge-rc {
        display: inline-block;
        margin-top: 10px;
        padding: 2px 10px;
        background: rgba(99, 102, 241, 0.15);
        color: var(--veil-accent-primary);
        border: 1px solid var(--veil-accent-primary);
        border-radius: var(--veil-radius-full);
        font-size: 0.75rem;
        font-weight: 600;
      }
      .veil-form-group {
        margin-bottom: 20px;
      }
      .veil-label {
        display: block;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--veil-text-secondary);
        margin-bottom: 8px;
      }
      .veil-input {
        width: 100%;
        padding: 12px 16px;
        background: var(--veil-bg-surface-elevated);
        border: 1px solid var(--veil-border);
        border-radius: var(--veil-radius-md);
        color: var(--veil-text-primary);
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s;
      }
      .veil-input:focus {
        border-color: var(--veil-accent-primary);
        box-shadow: 0 0 0 2px var(--veil-accent-glow);
      }
      .veil-btn {
        width: 100%;
        padding: 12px 20px;
        border-radius: var(--veil-radius-md);
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: all 0.2s;
      }
      .veil-btn-primary {
        background: var(--veil-accent-primary);
        color: #ffffff;
      }
      .veil-btn-primary:hover {
        background: var(--veil-accent-primary-hover);
      }
      .veil-btn-secondary {
        background: var(--veil-bg-surface-elevated);
        color: var(--veil-text-primary);
        border: 1px solid var(--veil-border);
      }
      .veil-btn-secondary:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .veil-btn-danger {
        background: var(--veil-danger);
        color: #ffffff;
      }
      .veil-btn-danger:hover {
        background: #dc2626;
      }
      .veil-btn-link {
        background: none;
        border: none;
        color: var(--veil-text-secondary);
        cursor: pointer;
        font-size: 0.85rem;
        text-decoration: underline;
        margin-top: 16px;
      }
      .veil-btn-link:hover {
        color: var(--veil-text-primary);
      }
      .veil-auth-error {
        margin-top: 14px;
        padding: 10px;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid var(--veil-danger);
        border-radius: var(--veil-radius-md);
        color: var(--veil-danger);
        font-size: 0.85rem;
        text-align: center;
      }
      .veil-auth-footer {
        text-align: center;
      }
      .veil-dashboard-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--veil-border);
        padding-bottom: 16px;
        margin-bottom: 20px;
      }
      .veil-space-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .veil-space-indicator {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--veil-success);
        box-shadow: 0 0 10px var(--veil-success);
      }
      .veil-space-title {
        font-size: 1.15rem;
        font-weight: 600;
      }
      .veil-space-id {
        font-size: 0.75rem;
        color: var(--veil-text-muted);
      }
      .veil-header-actions {
        display: flex;
        gap: 8px;
      }
      .veil-header-actions .veil-btn {
        width: auto;
        padding: 8px 14px;
        font-size: 0.85rem;
      }
      .veil-card {
        background: var(--veil-bg-surface-elevated);
        border: 1px solid var(--veil-border);
        border-radius: var(--veil-radius-md);
        padding: 16px;
        margin-bottom: 16px;
      }
      .veil-card h3 {
        font-size: 1rem;
        margin-bottom: 6px;
      }
      .veil-muted {
        color: var(--veil-text-secondary);
        font-size: 0.85rem;
        margin-bottom: 12px;
      }
      .veil-fingerprint {
        font-family: var(--veil-font-mono);
        font-size: 0.8rem;
        background: var(--veil-bg-base);
        padding: 10px;
        border-radius: var(--veil-radius-sm);
        border: 1px solid var(--veil-border);
        letter-spacing: 0.05em;
        word-break: break-all;
      }
      .veil-status-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .veil-status-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
      }
      .veil-badge-success {
        background: rgba(16, 185, 129, 0.15);
        color: var(--veil-success);
        border: 1px solid var(--veil-success);
        padding: 2px 8px;
        border-radius: var(--veil-radius-full);
        font-size: 0.7rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
